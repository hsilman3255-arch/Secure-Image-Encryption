{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h2 class="mb-4">
    Welcome, {{ current_user.username }}
</h2>

<div class="row">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <h4>Encrypt Image</h4>

                <p>Upload and encrypt an image.</p>

                <a href="{{ url_for('image.encrypt') }}" class="btn btn-primary">
                    Encrypt Image
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <h4>Decrypt Image</h4>

                <p>Decrypt an encrypted image.</p>

            <a href="{{ url_for('image.decrypt') }}" class="btn btn-success">
                Decrypt Image
            </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
